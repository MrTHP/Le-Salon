# ============================================================================
#  le-salon — client IRCv3 moderne en Rust, interface GPUI (Zed)
#
#  Workspace :
#    crates/ircv3-core  protocole, modèle partagé, réseau TLS, commandes
#    crates/le-salon    application de bureau GPUI
# ============================================================================

[workspace]
resolver = "2"
members = [
    "crates/ircv3-core",
    "crates/le-salon",
]

[workspace.package]
version = "1.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["ircv3-asm contributors"]
repository = "https://github.com/MrTHP/Le-Salon"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = "0.11"
gpui = "0.2.2"
keyring = "4"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "0.9"
unicode-segmentation = "1"
webpki-roots = "1"

# xattr 0.2.3 ne compile plus avec libc >= 0.2.191 sur Linux (ENOATTR a été
# retiré de libc car Linux utilise ENODATA). On embarque une copie corrigée.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
